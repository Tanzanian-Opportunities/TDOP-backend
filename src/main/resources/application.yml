  secret: ${JWT_SECRET:Q1lj9HLcJnUAQYG/zHXAGHhu1ewIY7wfh+0eQFCTY+yYAmWWky9oBRFPpgYaEYWS}
  expiration: 86400000
  refresh-expiration: 604800000

mail:
