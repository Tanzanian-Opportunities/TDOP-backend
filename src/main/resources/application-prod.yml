spring:
  profiles: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tdop_prod}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    tdop: INFO
    org.hibernate.SQL: WARN
