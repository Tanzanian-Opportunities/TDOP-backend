spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  security:
    jwt:
      secret: test-secret-key-for-testing-only-32-chars-long!
      expiration: 86400000
      refresh-expiration: 604800000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: WARN
    tdop: INFO

app:
  cors:
    allowed-origins: http://localhost:3000
  file:
    upload-dir: /tmp/test-uploads
